<line x1="370" y1="660" x2="400" y2="660" stroke="#72c5e4" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="735" y1="660" x2="765" y2="660" stroke="#72c5e4" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="1100" y1="660" x2="1130" y2="660" stroke="#72c5e4" stroke-width="2" marker-end="url(#arrow)"/>
<text x="35" y="841" fill="#e0bb6d" font-size="16">证据边界：结构是真实重建，动力学是工程假设；随机种子重复不等于生物重复。</text>
<text x="35" y="879" fill="#a5b7cb" font-size="16">研究问题：在明确编码及动力学下，结构、刺激时序和增益如何影响下游响应？</text>
